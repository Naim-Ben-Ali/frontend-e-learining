<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sahalli E-Learning Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Security Headers -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
    img-src 'self' https: data: http://localhost:8080;
    font-src 'self' https://fonts.gstatic.com data:;
    connect-src 'self' http://localhost:8080 https: ws:;
    frame-src https://accounts.google.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self' http://localhost:8080;
  ">

  <!-- No XSS Protection (browser default is sufficient) -->
  <meta http-equiv="X-XSS-Protection" content="0">

  <!-- Prevent Clickjacking -->
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">

  <!-- Disable MIME Type Sniffing -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<app-root></app-root>

<!-- Self-XSS Protection Notice (runs before any scripts) -->
<noscript>
  <div style="padding: 20px; background-color: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; margin: 20px; font-family: system-ui, -apple-system, sans-serif;">
    <strong>⚠️ JavaScript Required:</strong> This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.
  </div>
</noscript>

<script>
  // Warn users about Self-XSS attacks if they try to paste code in console
  console.warn('%cWARNING: Self-XSS Protection', 'color: red; font-size: 16px; font-weight: bold;');
  console.warn('%cDo NOT paste untrusted code in this console.', 'color: red; font-size: 14px;');
  console.warn('%cThis console is for developers. Attackers can use pasted code to compromise your account.', 'color: orange; font-size: 12px;');
</script>
</body>
</html>
